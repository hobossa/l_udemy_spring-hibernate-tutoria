<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Student Registration Form</title>

</head>
<body>

    <h3>Student Registration Form</h3>
    <form th:action="@{./processForm}" th:object="${student}" method="POST">
        First name: <input type="text" th:field="*{firstName}" placeholder="What's your first name?"/>
        <br><br>
        Last name: <input type="text" th:field="*{lastName}" placeholder="What's your last name?"/>
        <br><br>
        Country:
        <select th:field="*{country}">
            <option th:each="tempCountry : ${countries}" th:value="${tempCountry}" th:text="${tempCountry}" />
        </select>
        <br><br>
        <input type="submit" value="Submit"/>
    </form>

</body>
</html>
